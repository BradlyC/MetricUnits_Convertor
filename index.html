<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Units-Converter</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
     
    <div id="myApp">
    <div id="uperPart">
     <h1 id="tittle">Metric/Imperial Unit Conversions</h1>
      <input type="text" id="User-Input" placeholder="  e.g 20"><br><br>
      <button id="convert-btn"><b>Convert</b></button>
      
            </div>

        <div id="bottomPart">
            <div class="outputBoxes">
                <h3 >Length (Meter/Feet)</h3>
                  <p class="internals" id="output1">e.g 20 meter = 65.616 feet | 20 feet = 6.096 meters</p>
            </div>

                   <div class="outputBoxes">
                      <h3>Volume (Liters/Gallons)</h3>
                      <p class="internals" id="output2">e.g 20 liter = 5.284 gallons | 20 gallons = 75.708 liters</p>
                   </div>
                          
                           <div class="outputBoxes">
                           <h3 >Mass (Kilograms/Pounds)</h3>
                           <p class="internals" id="output3">e.g 20 Kilos = 44.092 pounds | 20 pounds = 9.072 kilos</p>
                           </div>
         </div>

</div>
    <script src="/index.js"></script>

</body>
</html>
